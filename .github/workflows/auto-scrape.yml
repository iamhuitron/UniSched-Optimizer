name: Auto-Update University Catalog & Schedules

on:
  schedule:
    # Runs at 06:00 UTC every Monday
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run schedule scrapers
        run: node scripts/scraper/scrape.mjs

      - name: Run verification test suite
        run: npm test

      - name: Commit and push changes if any
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status -s fixtures public/fixtures src/lib/catalog.ts) ]]; then
            git add fixtures public/fixtures src/lib/catalog.ts
            git commit -m "chore(catalog): auto-update university schedules [skip ci]"
            git push origin main
          else
            echo "No schedule updates detected. Everything is up to date."
          fi
